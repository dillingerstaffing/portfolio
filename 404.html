<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ece6d5">
<title>Page not found · Chris Dillinger</title>
<link rel="icon" type="image/png" href="/portfolio/icon-192.png">
<link rel="apple-touch-icon" href="/portfolio/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #241f17;
    --muted: #5e5648;
    --bg: #ece6d5;
    --paper: #f4efe0;
    --line: #c9bfa4;
    --acid: #8c3f22;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
  }
  html, body { overflow-x: clip; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    box-sizing: border-box;
  }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    max-width: 420px;
    width: 100%;
    padding: 40px 36px 36px;
    box-sizing: border-box;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .18em;
    color: var(--acid);
    margin: 0 0 18px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 30px;
    line-height: 1.2;
    margin: 0 0 12px;
  }
  p {
    color: var(--muted);
    font-size: 17px;
    line-height: 1.55;
    margin: 0 0 28px;
  }
  .actions { display: grid; gap: 12px; }
  .btn {
    display: block;
    text-align: center;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: .08em;
    text-decoration: none;
    padding: 14px 18px;
    border: 1px solid var(--ink);
    box-sizing: border-box;
  }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn.primary:hover, .btn.primary:focus-visible { background: var(--acid); border-color: var(--acid); color: #fdfaf1; }
  .btn.secondary { background: transparent; color: var(--ink); }
  .btn.secondary:hover, .btn.secondary:focus-visible { border-color: var(--acid); color: var(--acid); }
  .btn:focus-visible { outline: 2px solid var(--acid); outline-offset: 3px; }
  .foot {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .1em;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">404</p>
    <h1>Page not found.</h1>
    <p>The link you followed does not point anywhere. The portfolio is still here.</p>
    <div class="actions">
      <a class="btn primary" href="https://dillingerstaffing.github.io/portfolio/">BACK TO THE PORTFOLIO</a>
      <a class="btn secondary" href="mailto:shipthisgroup@gmail.com?subject=Portfolio%20inquiry">EMAIL CHRIS</a>
    </div>
    <div class="foot">CHRIS DILLINGER · LOW-LEVEL SYSTEMS PROGRAMMING</div>
  </main>
</body>
</html>
